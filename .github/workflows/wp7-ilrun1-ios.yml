name: WP7 BIND1 iOS
run-name: ${{ inputs.test_label || 'V7' }} | WP7 BIND1 iOS

on:
  push:
    branches: [main, codex/bind1-v7]
    paths:
      - 'src/IlPayload/**'
      - 'src/ILRun1Host/**'
      - 'src/Wp7Binding/**'
      - 'src/XapScan/**'
      - 'tests/Wp7Binding.Tests/**'
      - 'tests/assert-ilrun1-interpreter-config.py'
      - 'tests/assert-real-wp7-xna.py'
      - 'tests/test_real_wp7_xna_contract.py'
      - '.github/workflows/wp7-ilrun1-ios.yml'
  workflow_dispatch:
    inputs:
      test_label:
        description: External test label; does not change the app version.
        required: true
        default: V7
        type: string

jobs:
  ilrun1-ios15:
    runs-on: macos-15
    env:
      TEST_LABEL: ${{ inputs.test_label || 'V7' }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.303'

      - name: Validate external test label
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TEST_LABEL" =~ ^V[0-9]+$ ]]
          echo "[TEST][EXTERNAL_LABEL] $TEST_LABEL"

      - name: Pin .NET 9 SDK and workload set
        shell: bash
        run: |
          cat > global.json <<'JSON'
          {
            "sdk": {
              "version": "9.0.303",
              "rollForward": "disable",
              "workloadVersion": "9.0.303"
            }
          }
          JSON
          dotnet --version
          test "$(dotnet --version)" = "9.0.303"

      - name: Select Xcode 16.4
        shell: bash
        run: |
          set -euxo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Environment
        shell: bash
        run: |
          set -euxo pipefail
          dotnet --info
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          test -d "$(xcrun --sdk macosx --show-sdk-path)"
          xcrun --find clang
          clang --version
          ls -1 /Applications | grep '^Xcode' || true

      - name: Install pinned iOS 18.5 workload
        shell: bash
        run: |
          set -euxo pipefail
          dotnet --version
          dotnet workload install ios
          dotnet workload list | tee /tmp/workloads.txt
          grep -q '18.5.9207/9.0.100' /tmp/workloads.txt
          echo '[BOOTUI2][WORKLOAD_PIN] ios=18.5.9207 workload-set=9.0.303'

      - name: Verify ILRUN1 interpreter and external-payload contract
        shell: bash
        run: python3 tests/assert-ilrun1-interpreter-config.py

      - name: Test BIND1 fixture report contract
        run: python3 -m unittest tests/test_real_wp7_xna_contract.py -v

      - name: Run BIND1 resolver tests
        run: dotnet run --project tests/Wp7Binding.Tests/Wp7Binding.Tests.csproj -c Release

      - name: Build XAPSCAN1
        run: dotnet build src/XapScan/XapScan.csproj -c Release

      - name: Fetch, scan, validate, and package Aleterated fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/real src/ILRun1Host/Assets
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/Akfly/Aleterated/6144ca9a7b97cba4d781be40fdedf286e8d7f961/rotations2/rotations2/bin/Windows%20Phone/Debug/Aleterated.xap' \
            --output .ci/real/Aleterated.xap
          echo '69bd93627f4fa2c567748e36c3487c083db95c0efe01ef203bf60179bf9342a1  .ci/real/Aleterated.xap' | shasum -a 256 --check
          dotnet run --project src/XapScan/XapScan.csproj -c Release --no-build -- \
            .ci/real/Aleterated.xap --out .ci/real/Aleterated.xapscan1.json
          python3 tests/assert-real-wp7-xna.py .ci/real/Aleterated.xapscan1.json
          cp .ci/real/Aleterated.xap src/ILRun1Host/Assets/Aleterated.xap
          cp .ci/real/Aleterated.xapscan1.json src/ILRun1Host/Assets/Aleterated.xapscan1.json

      - name: Build external IL payload
        shell: bash
        run: |
          set -euxo pipefail
          dotnet build src/IlPayload/IlPayload.csproj -c Release
          test -s src/IlPayload/bin/Release/net9.0/IlPayload.dll
          mkdir -p src/ILRun1Host/Assets
          cp src/IlPayload/bin/Release/net9.0/IlPayload.dll src/ILRun1Host/Assets/IlPayload.dll
          shasum -a 256 src/ILRun1Host/Assets/IlPayload.dll

      - name: Verify payload is not statically referenced
        shell: bash
        run: |
          set -euxo pipefail
          if grep -nE '<ProjectReference[^>]*IlPayload|<Reference[[:space:]][^>]*Include="IlPayload' src/ILRun1Host/ILRun1Host.csproj; then
            echo '[ILRUN1][STATIC_REFERENCE_FAIL] IlPayload must remain an opaque runtime file.'
            exit 1
          fi
          grep -n 'ProjectReference Include="../Wp7Binding/Wp7Binding.csproj"' src/ILRun1Host/ILRun1Host.csproj
          grep -n 'BundleResource Include="Assets/IlPayload.dll"' src/ILRun1Host/ILRun1Host.csproj
          grep -n 'BundleResource Include="Assets/Aleterated.xap"' src/ILRun1Host/ILRun1Host.csproj
          grep -n 'BundleResource Include="Assets/Aleterated.xapscan1.json"' src/ILRun1Host/ILRun1Host.csproj
          echo '[ILRUN1][STATIC_REFERENCE_CHECK] PASS'

      - name: Publish BIND1 stable-host interpreter iOS 15 device app
        shell: bash
        run: |
          set -euxo pipefail
          dotnet publish src/ILRun1Host/ILRun1Host.csproj \
            -f net9.0-ios \
            -c Release \
            -r ios-arm64 \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:UseInterpreter=false \
            -p:MtouchInterpreter=all \
            -p:TrimMode=full \
            -p:MtouchUseLlvm=false \
            -p:EnableCodeSigning=false \
            -p:CodesignRequireProvisioningProfile=false \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:ArchiveOnBuild=false

      - name: Verify device app contract
        shell: bash
        run: |
          set -euxo pipefail
          APP="$(find src/ILRun1Host/bin/Release/net9.0-ios/ios-arm64 -type d -name '*.app' | head -n 1)"
          test -n "$APP"
          test -d "$APP"
          test -s "$APP/IlPayload.dll"
          test -s "$APP/Aleterated.xap"
          test -s "$APP/Aleterated.xapscan1.json"
          echo "APP=$APP" >> "$GITHUB_ENV"

          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          MIN_IOS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")"
          APP_TITLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          APP_DISPLAY_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          echo "CFBundleExecutable=$EXECUTABLE"
          echo "MinimumOSVersion=$MIN_IOS"
          echo "CFBundleDisplayName=$APP_TITLE"
          echo "CFBundleIdentifier=$APP_ID"
          echo "CFBundleVersion=$APP_VERSION"
          echo "CFBundleShortVersionString=$APP_DISPLAY_VERSION"
          test "$MIN_IOS" = "15.0"
          test "$APP_TITLE" = "WP7 ILRUN1"
          test "$APP_ID" = "com.phai.wp7.ilrun1"
          test "$APP_VERSION" = "1"
          test "$APP_DISPLAY_VERSION" = "0.1"
          test -s "$APP/$EXECUTABLE"
          echo "APP_BUNDLE_NAME=$(basename "$APP")" >> "$GITHUB_ENV"
          echo "APP_EXECUTABLE=$EXECUTABLE" >> "$GITHUB_ENV"
          python3 tests/assert-real-wp7-xna.py "$APP/Aleterated.xapscan1.json"
          echo '[BIND1][RAW_RESOURCES] PASS'
          echo '[APP][IDENTITY_UNCHANGED] PASS'

          echo '[BIND1][DEVICE_APP_BUILD] PASS'
          echo '[ILRUN1][PAYLOAD_RAW_FILE] PASS'

      - name: Package unsigned IPA for ESign
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf artifacts
          mkdir -p artifacts/Payload
          cp -R "$APP" artifacts/Payload/
          (
            cd artifacts
            zip -qry WP7-BIND1-${TEST_LABEL}-ios15-unsigned.ipa Payload
          )
          test -s artifacts/WP7-BIND1-${TEST_LABEL}-ios15-unsigned.ipa
          shasum -a 256 artifacts/WP7-BIND1-${TEST_LABEL}-ios15-unsigned.ipa

      - name: Verify unsigned IPA contents
        shell: bash
        run: |
          set -euo pipefail
          python3 - "artifacts/WP7-BIND1-${TEST_LABEL}-ios15-unsigned.ipa" "$APP_BUNDLE_NAME" "$APP_EXECUTABLE" <<'PY'
          import plistlib
          import sys
          import zipfile

          ipa_path, app_bundle, executable = sys.argv[1:]
          prefix = f"Payload/{app_bundle}/"
          required = {
              prefix + executable,
              prefix + "IlPayload.dll",
              prefix + "Aleterated.xap",
              prefix + "Aleterated.xapscan1.json",
              prefix + "Info.plist",
          }
          with zipfile.ZipFile(ipa_path) as ipa:
              names = set(ipa.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"IPA is missing required files: {missing}")
              info = plistlib.loads(ipa.read(prefix + "Info.plist"))
              assert info["MinimumOSVersion"] == "15.0"
              assert info["CFBundleDisplayName"] == "WP7 ILRUN1"
              assert info["CFBundleIdentifier"] == "com.phai.wp7.ilrun1"
              assert info["CFBundleVersion"] == "1"
              assert info["CFBundleShortVersionString"] == "0.1"
          print("[BIND1][IPA_CONTENTS] PASS")
          print("[APP][IDENTITY_UNCHANGED] PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: WP7-BIND1-${{ inputs.test_label || 'V7' }}-ios15-unsigned
          path: artifacts/WP7-BIND1-${{ inputs.test_label || 'V7' }}-ios15-unsigned.ipa
          if-no-files-found: error
